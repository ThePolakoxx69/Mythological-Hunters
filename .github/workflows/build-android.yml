name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Validate and export APK
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          test -f project.godot
          test -f scenes/main.tscn
          test -f scripts/main.gd
          test -f export_presets.cfg

      - name: Validate project with Godot
        run: godot --headless --editor --path . --quit

      - name: Export Android debug APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/Mythological-Hunters.apk
          test -s build/Mythological-Hunters.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mythological-Hunters-Android-APK
          path: build/Mythological-Hunters.apk
          if-no-files-found: error
          retention-days: 14
